<body>
    <topbar>
        <p>the placeholder project</p>
    </topbar>
    <p>募集は終了しました！結果発表までお楽しみに！</p>
    <style>
        .falling-text {
            position: absolute;
            font-size: 40px;
            white-space: nowrap;
            animation: fall linear infinite;
            z-index: 100;
            color:#000;
            font-family: "Yuji Boku", serif;
        }

        @keyframes fall {
            0% {
                top: -50px;
                opacity: 1;
            }

            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        topbar {
            box-shadow: 0px 10px 18px -22px #444444;
            width: 100%;
            border-radius: 10px;
        }

        .kanjibox {
            position: relative;
            display: block;
            font-size: 11em;
            text-align: center;
            padding-bottom: 10px;
            font-weight: bolder;
            border: 20px outset #444444;
            max-width: 300px;
            max-height: 300px;
            font-family: "Yuji Boku", serif;
            font-weight: 400;
            font-style: normal;
        }

        body {
            overflow: hidden;
            width: calc(100% - 20px);
            display: flex;
            text-align: center;
            font-family: "Noto Sans JP", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            position: absolute;
            flex-wrap: wrap;
            flex-direction: column;
            justify-content: center;
            align-content: center;
            align-items: center;
            padding: auto;
        }
    </style>
    <script>
        var mojilist;
        var kanjibox = document.getElementById('kan2');
        kanjibox.addEventListener('keydown', kan2);

        function kan2(event) {
            if (event.key === 'Enter') {
                if (kanjibox.value.length === 0 || kanjibox.value.length >= 2) {
                    kan2.value = "";
                    document.getElementById('kan1').style.color = "red";
                    setTimeout(function () {

                        document.getElementById('kan1').style.color = "#000";
                    }, 2000);
                } else {
                    $.ajax({
                        type: "GET",
                        url: "https://c.haruharutv.jp/tpp-2024-vote-1.php",
                        data: { kan: kanjibox.value },
                    }).done(function (response) {
                        createFallingText("Thank You! 投稿完了です サーバ処理されると文字が降ってきます！");
                        createFallingText("なお、2連続で投稿する際は負荷軽減のため、再読み込みをお勧めします。");
                        kanjibox.value = "";
                        mojilist = response;
                        characters = mojilist.split(',');
                        letsfall();
                    });
                }
            }
        }

        var maxCharactersOnScreen = 10;
        var activeCharacters = [];

        function createFallingText(text) {
            var span = document.createElement('span');
            span.className = 'falling-text';
            span.textContent = text;
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (3 + Math.random() * 5) + 's';
            document.body.appendChild(span);

            activeCharacters.push(span);
            if (activeCharacters.length > maxCharactersOnScreen) {
                var oldCharacter = activeCharacters.shift();
                oldCharacter.remove();
            }
            span.addEventListener('animationend', () => {
                span.remove();
            });
        }

        function letsfall() {
            setInterval(() => {
                if (characters.length > 0) {
                    var randomCharacter = characters[Math.floor(Math.random() * characters.length)];
                    createFallingText(randomCharacter);
                }
            }, 2000);
        }

    </script>
</body>

</html>
