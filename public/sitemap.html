    <h1>SiteMap</h1>
    <ul id="siteMapList"></ul>
    
    <script>
//    window.addEventListener('DOMContentLoaded', async () => {
setTimeout(async function(){
      try {
        const siteMapUrl = '/sitemap.xml'; // サイトマップのURLを指定してください
        const response = await fetch(siteMapUrl);
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const urlNodes = xmlDoc.getElementsByTagName('url');
    
        const siteMapList = document.getElementById('siteMapList');
        for (let i = 0; i < urlNodes.length; i++) {
          const locNode = urlNodes[i].getElementsByTagName('loc')[0];
          const lastModNode = urlNodes[i].getElementsByTagName('lastmod')[0];
          const priorityNode = urlNodes[i].getElementsByTagName('priority')[0];
          const frequencyNode = urlNodes[i].getElementsByTagName('changefreq')[0];
    
          const listItem = document.createElement('li');
          const anchor = document.createElement('a');
          anchor.href = locNode.textContent;
          anchor.textContent = decodeURI(locNode.textContent.substr(location.hostname.length+8)).replace(/</g, "&lt;").replace(/>/g, "&gt;");
          anchor.className = "afa";
          listItem.appendChild(anchor);
    
          if (lastModNode) {
            const lastModified = new Date(lastModNode.textContent).toLocaleString();
            listItem.appendChild(document.createTextNode(' - 更新日: ' + lastModified));
          }
          if (frequencyNode) {
            listItem.appendChild(document.createTextNode(' - 更新周期: ' + frequencyNode.textContent));
          }
    
          siteMapList.appendChild(listItem);
        }
      } catch (error) {
        console.error('Error fetching or parsing site map:', error);
      }
    },400);
//    });
    </script>
