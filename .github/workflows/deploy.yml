name: Build, optimize, and deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install optimization tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser sharp-cli

      - name: Build optimized site
        run: |
          set -e

          # 【変更点】ソースディレクトリを public に指定
          SRC_DIR="public"
          OUT_DIR="dist"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # public/ の「中身だけ」を dist/ にコピー
          rsync -a \
            --exclude '.DS_Store' \
            "$SRC_DIR"/ "$OUT_DIR"/

          # HTMLのミニファイ
          find "$OUT_DIR" -type f \( -name "*.html" -o -name "*.htm" \) | while read -r file; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --minify-css true \
              --minify-js true \
              -o "$file" "$file"
          done

          # CSSのミニファイ
          find "$OUT_DIR" -type f -name "*.css" | while read -r file; do
            cleancss -o "$file" "$file"
          done

          # JSのミニファイ
          find "$OUT_DIR" -type f -name "*.js" | while read -r file; do
            terser "$file" --compress --mangle --output "$file"
          done

          # 画像のWebP変換 (元の画像は削除せず保持)
          find "$OUT_DIR" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | while read -r file; do
            out="${file%.*}.webp"

            sharp \
              -i "$file" \
              -o "$out" \
              -f webp \
              -q 40

            if [ "$(stat -c%s "$out")" -gt 1048576 ]; then
              sharp -i "$file" -o "$out" -f webp -q 65
            fi

            if [ "$(stat -c%s "$out")" -gt 1048576 ]; then
              sharp -i "$file" -o "$out" -f webp -q 50
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
